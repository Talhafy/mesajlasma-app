# ============================================================================
# GİTHUB ACTIONS CONTINUOUS INTEGRATION (CI / QUALITY GATE) WORKFLOW
# ============================================================================
#
# Bu workflow, koda yapılan her Pull Request'te ve main/master dallarına yapılan
# her push işleminde otomatik olarak tetiklenir. Projenin derlenebilirliğini,
# veritabanı migrasyon zincirini, test kapsama oranını (coverage), güvenlik
# açığı taramasını (audit) ve duman (smoke) testlerini doğrular.

name: Quality Gate

# ----------------------------------------------------------------------------
# WORKFLOW TETİKLENME KURALLARI (Triggers)
# ----------------------------------------------------------------------------
on:
  pull_request: # Herhangi bir Pull Request açıldığında veya güncellendiğinde çalışır
  push:
    branches: [main, master] # Yalnızca main veya master dallarına kod birleştirildiğinde çalışır

# ----------------------------------------------------------------------------
# EŞZAMANLILIK YÖNETİMİ (Concurrency)
# ----------------------------------------------------------------------------
# Aynı Pull Request için yeni bir commit atıldığında, boşa kaynak harcamamak için
# önceki çalışan CI pipeline'ını otomatik olarak iptal eder.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ----------------------------------------------------------------------------
# GÜVENLİK VE İZİNLER (Least Privilege Principle)
# ----------------------------------------------------------------------------
# GitHub token'ına varsayılan olarak yalnızca depoyu okuma yetkisi verilir.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # İŞ 1: QUALITY GATE (Ana Test ve Kalite Kontrol İşlemi)
  # ==========================================================================
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest # En güncel Ubuntu Linux sanal makinesinde çalışır
    timeout-minutes: 20    # Sonsuz döngüleri önlemek için 20 dakika üst sınır

    # ------------------------------------------------------------------------
    # DOCKER SERVİS KONTEYNERLERİ (Service Containers)
    # ------------------------------------------------------------------------
    # CI testlerinin gerçek PostgreSQL ve Redis servisleriyle koşturulmasını sağlar.
    services:
      # PostgreSQL Veritabanı Servisi
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mesajlasma_test
        ports:
          - 5432:5432
        # Veritabanının hazır olup olmadığını denetleyen sağlık kontrolü (Healthcheck)
        options: >-
          --health-cmd="pg_isready -U postgres -d mesajlasma_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # Redis Bellek İçi Veritabanı Servisi
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Redis'in hazır olup olmadığını denetleyen ping kontrolü
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # ------------------------------------------------------------------------
    # TEST ORTAMI DEĞİŞKENLERİ (Environment Variables)
    # ------------------------------------------------------------------------
    env:
      NODE_ENV: test
      PORT: 3000
      CLIENT_ORIGIN: http://127.0.0.1:4173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mesajlasma_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters
      LOG_LEVEL: silent
      LOG_FILE_ENABLED: "false"
      MALWARE_SCAN_ENABLED: "false"
      R2_ENDPOINT: https://example.invalid
      R2_ACCESS_KEY_ID: ci-access-key
      R2_SECRET_ACCESS_KEY: ci-secret-key
      R2_BUCKET_NAME: ci-bucket
      REDIS_URL: redis://127.0.0.1:6379
      VITE_API_URL: http://127.0.0.1:3000/api

    # ------------------------------------------------------------------------
    # ADIM ADIM İŞLEM AKIŞI (Steps)
    # ------------------------------------------------------------------------
    steps:
      # Adım 1: Proje kaynak kodlarını sanal makineye indirir
      - uses: actions/checkout@v4

      # Adım 2: Node.js 22 çalışma ortamını kurar ve npm önbelleğini (cache) aktif eder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Adım 3: Backend bağımlılıklarını temiz kurulum (npm ci) ile yükler
      - name: Install backend dependencies
        run: npm ci

      # Adım 4: Frontend bağımlılıklarını yükler
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Adım 5: Prisma ORM istemci sınıflarını üretir
      - name: Generate Prisma client
        run: npx prisma generate

      # Adım 6: Veritabanı migrasyon zincirinin doğruluk kontrolünü yapar
      - name: Verify the empty-database migration chain
        run: |
          npm run db:validate
          npm run db:migrate:deploy
          npm run db:migrate:check
          npm run db:migrate:diff

      # Adım 7: Backend TypeScript derleme ve birim test kapsama kontrolü
      - name: Backend typecheck and coverage gate
        run: npm run ci

      # Adım 8: Frontend linter, test kapsama ve üretim derlemesi kontrolü
      - name: Frontend lint, coverage and production build gate
        run: npm --prefix frontend run ci

      # Adım 9: Bağımlılıklardaki bilinen güvenlik açıklarını (npm audit) tarar
      - name: Dependency vulnerability gate
        run: |
          npm run security:audit
          npm --prefix frontend run security:audit

      # Adım 10: Production API sunucu bundle'ını derler
      - name: Build production API
        run: npm run build

      # Adım 11: Derlenen API ve Frontend'i canlıya alma simülasyonu ile başlatıp Duman (Smoke) testini çalıştırır
      - name: Start production artifacts and run smoke test
        run: |
          npm run start > api-smoke.log 2>&1 &
          npm --prefix frontend run preview -- --host 127.0.0.1 > frontend-smoke.log 2>&1 &
          npm run smoke

      # Adım 12: Eğer Duman (Smoke) testi başarısız olursa arka plan sunucu loglarını ekrana basar
      - name: Show smoke logs on failure
        if: failure()
        run: |
          cat api-smoke.log || true
          cat frontend-smoke.log || true

      # Adım 13: Test kapsama raporlarını (Coverage Reports) GitHub Artifacts olarak kaydeder
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            frontend/coverage/
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # İŞ 2: DEPENDENCY REVIEW (Bağımlılık Değişikliği Güvenlik İncelemesi)
  # ==========================================================================
  # Yalnızca Pull Request'lerde çalışır; eklenen yeni paketlerde yüksek seviye
  # güvenlik açığı varsa Pull Request'i otomatik olarak kilitler.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
