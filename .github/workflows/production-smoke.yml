# ============================================================================
# CANLI ORTAM DUMAN TESTİ WORKFLOW'U (Production Smoke Test)
# ============================================================================
#
# Bu workflow, canlıya (Production / Staging) deployment yapıldıktan sonra
# gerçek canlı sunucu adreslerine otomatik istek atarak sistemin ayaklar üzerinde
# olduğunu (Health Check & Connectivity) doğrulayan manuel tetiklenebilir (Manual Trigger) bir akıştır.

name: Production Smoke Test

# ----------------------------------------------------------------------------
# WORKFLOW TETİKLENME KURALLARI (Triggers)
# ----------------------------------------------------------------------------
# Yalnızca GitHub Actions arayüzünden manuel olarak veya CD (Continuous Deployment)
# pipeline'ı tarafından API ile tetiklenebilir (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production API URL (ör: https://api.mesajlasma.com)
        required: true
        type: string
      web_url:
        description: Production Frontend URL (ör: https://mesajlasma.com)
        required: true
        type: string

# ----------------------------------------------------------------------------
# İZİNLER (Permissions)
# ----------------------------------------------------------------------------
permissions:
  contents: read

jobs:
  # ==========================================================================
  # İŞ: SMOKE TEST (Canlı Ortam Sağlık Doğrulaması)
  # ==========================================================================
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 5 dakika içinde tamamlanmalıdır

    steps:
      # Adım 1: Test betiğini (scripts/smoke-test.mjs) çalıştırmak için kodu çek
      - uses: actions/checkout@v4

      # Adım 2: Node.js 22 ortamını kur
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Adım 3: Canlı sunucuya 5 defa deneme atarak API ve Frontend hazır mı kontrol et
      - name: Verify deployed API and frontend
        env:
          SMOKE_API_URL: ${{ inputs.api_url }}
          SMOKE_WEB_URL: ${{ inputs.web_url }}
          SMOKE_ATTEMPTS: 5
          SMOKE_RETRY_DELAY_MS: 2000
        run: node scripts/smoke-test.mjs
