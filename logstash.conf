input {
  file {
    path => "/var/log/mesajlasma/app.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-mesajlasma-app"
    mode => "tail"
    codec => json
  }
}

filter {
  if [time] {
    date {
      match => ["time", "ISO8601"]
      target => "@timestamp"
      remove_field => ["time"]
    }
  }

  if ![event] {
    mutate {
      add_field => { "event" => "log.message" }
    }
  }

  mutate {
    add_field => {
      "[@metadata][target_index]" => "mesajlasma-api-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
